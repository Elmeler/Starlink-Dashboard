name: Build Windows .exe

# Trigger manually from the GitHub Actions tab, or automatically when you
# push a version tag (e.g. git tag v1.0.0 && git push --tags).
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Build React frontend ───────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # ── 3. Build Python backend + PyInstaller ─────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate icon
        working-directory: backend
        run: python generate_icon.py

      - name: Build executable
        working-directory: backend
        run: pyinstaller starlink-monitor.spec --noconfirm

      # ── 4. Package as ZIP ─────────────────────────────────────────────────────
      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path   "backend\dist\Starlink Monitor" `
            -DestinationPath "Starlink-Monitor-Windows.zip"

      # ── 5. Upload artifact (always available in Actions tab) ──────────────────
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Starlink-Monitor-Windows
          path: Starlink-Monitor-Windows.zip
          retention-days: 90

      # ── 6. Create GitHub Release when triggered by a version tag ──────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Starlink-Monitor-Windows.zip
          generate_release_notes: true
          body: |
            ## Starlink Monitor — Windows

            **Download `Starlink-Monitor-Windows.zip`, extract it, and run `Starlink Monitor\Starlink Monitor.exe`.**

            The app will appear in your system tray and open the dashboard in your browser automatically.

            ### Requirements
            - Windows 10 / 11 (x64)
            - Starlink dish reachable at `192.168.100.1` (connect to your Starlink network first)

            ### No installation needed
            Extract the ZIP anywhere and run the `.exe` directly.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
