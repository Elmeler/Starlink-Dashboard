name: Build Windows .exe

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Build React frontend ───────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # ── 3. Build Python backend + PyInstaller ─────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate icon
        working-directory: backend
        run: python generate_icon.py

      - name: Build executable
        working-directory: backend
        run: pyinstaller starlink-monitor.spec --noconfirm

      # ── 4. Build Inno Setup installer ─────────────────────────────────────────
      - name: Build installer
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          if (-not $ver -or $ver -eq "") { $ver = "0.0.0" }
          Write-Host "Building installer for version: $ver"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DAppVersion=$ver `
            backend\setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ── 5. Package portable ZIP ───────────────────────────────────────────────
      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path        "backend\dist\Starlink Monitor" `
            -DestinationPath "Starlink-Monitor-Windows-Portable.zip"

      # ── 6. Upload artifacts (always available in Actions tab) ─────────────────
      - name: Upload portable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Starlink-Monitor-Portable
          path: Starlink-Monitor-Windows-Portable.zip
          retention-days: 90

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Starlink-Monitor-Installer
          path: backend/installer_out/Starlink-Monitor-Setup-*.exe
          retention-days: 90

      # ── 7. Create GitHub Release when triggered by a version tag ──────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            backend/installer_out/Starlink-Monitor-Setup-*.exe
            Starlink-Monitor-Windows-Portable.zip
          generate_release_notes: true
          body: |
            ## Starlink Monitor — Windows

            ### Recommended: Installer
            Download **`Starlink-Monitor-Setup-*.exe`** and run it.
            Creates a Start Menu entry, optional desktop shortcut, and optional auto-start with Windows.

            ### Portable (no install)
            Download **`Starlink-Monitor-Windows-Portable.zip`**, extract anywhere, and run `Starlink Monitor.exe`.

            ---

            ### Requirements
            - Windows 10 / 11 (x64)
            - Starlink dish reachable at `192.168.100.1` (connect to your Starlink Wi-Fi first)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
